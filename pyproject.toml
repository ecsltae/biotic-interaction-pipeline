[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "biotic-pipeline"
description = "Biotic interaction detection: pair-conditioned triple verifier with direction (recommended), plus the legacy sentence-level classifier"
readme = "README.md"
version = "3.1.0"

dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "requests>=2.31",
    "pandas>=2.0",
    "pyahocorasick>=2.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/ecsltae/biotic-interaction-pipeline"
Source = "https://github.com/ecsltae/biotic-interaction-pipeline"

[project.scripts]
biotic-api = "biotic_pipeline.api_server:main"

[tool.setuptools.packages.find]
where = ["src"]

# The relation lexicons are read at import time; without this they are left out of
# the wheel and `import biotic_pipeline` fails with FileNotFoundError.
[tool.setuptools.package-data]
biotic_pipeline = ["data/*.json"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I001", "RUF100"]
ignore = ["E501", "E402"]
