# Biotic Interaction Pipeline Configuration
# This file is used as the default; production values are deployed by Ansible
# from deploy/templates/config.toml.j2

[server]
host = "0.0.0.0"
port = 8003
workers = 1
log_level = "info"

[model]
# Legacy sentence-level classifier (BioticClassifier).
# Kept for the end-to-end text -> sentences -> scores path.
model_dir = ""         # must be set before running
device = "auto"        # auto | cuda:0 | cpu
threshold = 0.13       # EP-relax F1=0.868 @ this threshold (multi-task model)
max_length = 256

[verifier]
# Query-conditioned triple verifier (TripleVerifier) -- the recommended model.
# Takes a candidate (taxon, relation, taxon) plus its passage, and returns both
# the interaction decision and the argument direction.
# NOTE: this is a different decision unit. It needs candidate triples, which this
# package does not yet generate -- see README.
model_dir = ""         # joint_a05_s1 checkpoint
device = "auto"
threshold = 0.50       # validated on three held-out dev splits; 0.88 for more precision
dir_abstain = 0.60     # 75% coverage at 0.889 accuracy on 84 human-annotated items
max_length = 256
threads = 8

[data]
# GloBI interaction vocabulary (591 terms) — improves filter recall
interaction_dict = "data/interaction_dict.csv"
# Binomial species gazetteer (4.2M names) — species-name fallback in pre-filter
species_dict = "data/species_dict.csv"
